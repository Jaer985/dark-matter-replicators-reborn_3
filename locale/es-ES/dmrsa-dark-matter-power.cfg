[item-description]
dmrsa-collider=Un anillo de imanes superconductores que lanza los racimos de tenemut unos contra otros hasta que los restos colapsan en materia oscura pura. Consume 250 MW durante 200 segundos por unidad: 50 GJ de trabajo por 25 GJ de combustible, hasta que la investigación de duplicación cierre la diferencia. La red ha pasado cinco niveles tomando materia prestada y volviéndola a armar; el anillo deja de pedir prestado: por primera vez la fábrica no copia una sustancia, fabrica una que no existe en la naturaleza.
dmrsa-annihilator=Quema materia oscura y la devuelve como calor puro. La cámara aniquila la sustancia consigo misma —materia metaestable a la que da permiso para desintegrarse—, y por eso una unidad devuelve sus 25 GJ completos: diez minutos de calor a 41,7 MW que los intercambiadores y las turbinas de vapor del juego base convierten en electricidad. La mitad del bucle: el anillo gasta 50 GJ para fabricar una unidad que vale 25, y la investigación de duplicación es donde la contabilidad empieza a dar beneficio.
dmrsa-annihilation-coil=Atrapa la desintegración en lugar del calor. La cámara deja que la materia oscura se deshaga y recoge lo que cae como calor; la bobina atraviesa esa misma desintegración con una red de fases y toma la carga directamente, así que nada entre el combustible y la red está hecho de tuberías. 2x2, sin agua, sin intercambiadores de calor y sin turbinas de vapor: 25 GJ por unidad, diez minutos a 41,7 MW, exactamente la contabilidad de la cámara. Gana en espacio y en fontanería, no en julios: responde a la red en el mismo tick en que se alimenta.

