[technology-description]
dmrsa-collider-1=El anillo que desgarra la materia. Desbloquea el Anillo acelerador y la receta de colisión que convierte 25 tenemut y un conductor de nanofase en una unidad de materia oscura: 250 MW durante 200 segundos. La materia oscura es el combustible más denso que la red de replicación puede fabricar, con 25 GJ por unidad, y ningún reactor vanilla la quema: solo la Cámara de aniquilación la acepta. Fabricarla cuesta más energía de la que devuelve hasta que la investigación de duplicación alcance el ritmo.
dmrsa-annihilation=La cámara que devuelve la materia oscura. Desbloquea la Cámara de aniquilación, un reactor de materia oscura que quema una unidad en diez minutos de calor y entrega ese calor a los intercambiadores y turbinas del juego base. Investigar esta tecnología consume materia oscura: cada repetición gasta una unidad que podrías haber quemado para generar energía.
dmrsa-annihilation-coil=La red de fases que se salta la caldera. Desbloquea la Bobina de aniquilación, un generador de combustión de 2x2 que quema una unidad de materia oscura en diez minutos y entrega 41,7 MW directamente a la red. Los mismos 25 GJ por unidad que la cámara y el mismo combustible: la diferencia es todo lo que la cámara necesita detrás (tuberías de calor, agua, intercambiadores y turbinas). Respuesta instantánea, un cuarto del espacio y ninguna fontanería que defender; los julios son idénticos.
