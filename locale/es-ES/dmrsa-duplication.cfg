[technology-name]
dmrsa-duplication-tech=Duplicación de combustible (Nivel __1__)

[technology-description]
dmrsa-duplication-tech=Enseña a la red de replicación a duplicar combustibles químicos. Cada receta de replicación de combustible gana productividad — +100% de producción en el nivel 3, +200% en el nivel 4 y +300% en el nivel 5, acumulativos — y la receta de colisión del Anillo acelerador está incluida. Conviene mirar los números antes de reconstruir la red eléctrica alrededor: una caldera o un horno normal devuelven 0,80x del valor de combustión del combustible incluso en el nivel 3, mientras que un quemador de alto rendimiento — una torre de calefacción, 2,5x de efectividad — convierte ese mismo nivel en un excedente real (2,00x en el nivel 5). La duplicación no crea energía en una caldera normal. El bucle energético de fin de partida es el anillo y la cámara: el Anillo acelerador fabrica el combustible, la Cámara de aniquilación devuelve sus 25 GJ completos como calor en cualquier planeta, y la duplicación es lo que hace rentable ese bucle.
