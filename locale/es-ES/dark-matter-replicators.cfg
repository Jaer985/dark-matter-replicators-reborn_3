[item-description]
dmrsa-dark-matter-scoop=Un instrumento, no una máquina: un racimo de tenemut cargado en un armazón de acero que lee la resonancia del vacío e informa de lo que encuentra. Puede medir la materia oscura y recoger la suficiente para copiar minerales y fluidos sueltos, pero no hay nada que medir a escala ni nada que moldear.
dmrsa-dark-matter-transducer=Donde el recolector escucha, el transductor habla. Un conjunto de emisores que toma la descarga informe que recoge el recolector y le impone una elección — este elemento, esta forma, esta placa — convirtiendo el ruido en una decisión.
dmrsa-matter-conduit=Una guía de ondas desfasada, de anchura nanométrica, que deja pasar la materia oscura sin que se descomponga antes de llegar. Sin él la red puede mover materia; con él, la red puede construir circuitos y procesadores: piezas demasiado pequeñas para las manos y demasiado precisas para las herramientas.
dmrsa-dark-matter=Materia que no debería mantenerse unida, y se mantiene. El Anillo acelerador la arranca del tenemut y allí se queda: 25 GJ en una sola unidad, el combustible más denso que la red de replicación puede fabricar, tan estable que cabe en un cofre y dispuesta a devolverlo todo como calor en cuanto una cámara se lo permita. Ningún reactor vanilla la acepta: la Cámara de aniquilación es el único quemador que la admite.
dmrsa-tenemut=Un mineral cristalino que resuena con la materia oscura cuando se carga. Descubierto en un mundo remoto, es la única sustancia conocida capaz de tocar el vacío entre los átomos, y la única que puede atravesarlo. Se extrae de los yacimientos de tenemut, se refina en los paquetes de investigación de la red de replicación y el Anillo acelerador lo consume de 25 en 25.
dmrsa-replicator-vulcanus=Exclusivo de Vulcanus. Sintonizado con el corazón geotérmico del planeta — replica minerales metalúrgicos, calcita y metales fundidos a 3x de velocidad con alto ahorro energético.
dmrsa-replicator-fulgora=Exclusivo de Fulgora. Nacido de las tormentas electromagnéticas del planeta — replica electrónica avanzada y componentes superconductores a 3x de velocidad.
dmrsa-replicator-gleba=Exclusivo de Gleba. La única máquina capaz de replicación biológica — produce productos orgánicos con 100% de frescura y 3x de velocidad.
dmrsa-replicator-aquilo=Exclusivo de Aquilo. Maestro del frío absoluto — replica elementos crio-refinados y componentes de litio a una velocidad extrema de 5x utilizando enfriamiento superconductivo.

# Descripciones de items para los replicadores (reflejadas desde entity-description
# para que la descripción en mano/cursor se resuelva correctamente).
dmrsa-replicator-1=Replicador de nivel 1. La primera máquina en dar forma a la nada — convierte materia oscura cargada de tenemut en materiales sueltos (minerales, fluidos, placas básicas). Salida cruda, pero aquí comienza la replicación.
dmrsa-replicator-2=Replicador de nivel 2. Añade modelado atómico al proceso — puede formar formas sólidas y replicar elementos puros con fidelidad estructural. Mayor coste de energía por fabricación que el nivel 1.
dmrsa-replicator-3=Replicador de nivel 3. Extiende la replicación al reino molecular — sustancias químicas, aleaciones y fluidos. Se desbloquea antes de los planetas con paquetes de ciencia química; los replicadores planetarios manejan las recetas específicas de cada planeta.
dmrsa-replicator-4=Replicador de nivel 4. Alcanza precisión de grado industrial — replica dispositivos complejos (circuitos avanzados, unidades de procesamiento, la mayoría de componentes de Space Age) con fidelidad nanométrica.
dmrsa-replicator-5=Replicador de nivel 5. La cúspide de la replicación — copia cualquier cosa que el mod considere replicable, incluyendo artefactos alienígenas, materia exótica y los propios paquetes de ciencia.

dmrsa-refiner=Reemite la materia replicada a través de un entramado de obsidiana violeta, forzando el patrón del material un grado de calidad más arriba. Solo acepta estructuras cuya replicación ya dominas — los mismos objetos que la red de replicadores puede copiar. Cada ciclo cuesta tres veces la energía de una replicación normal y arriesga destruir la pieza (pérdida del 5%): un camino fiel y exigente hacia la calidad que nunca salta un grado.
dmrsa-tenemut-synthesizer=Cultiva tenemut en el vacío. La red cristalina no existe en la descarga: la máquina la impone, átomo a átomo, uno cada 4 segundos a cambio de 1 MW continuos. Lenta, estrecha y tragona comparada con una mina, pero es la única fuente de tenemut que no necesita que un planeta lo tenga.
