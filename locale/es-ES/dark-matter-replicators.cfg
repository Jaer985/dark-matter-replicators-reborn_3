[technology-description]
dmrsa-replication-1=El primer susurro del vacío. Desbloquea el Replicador simple, el Laboratorio de replicación y el Recolector de materia oscura: la primera máquina que copia materia, el laboratorio que la descifra y el instrumento que la lee.
dmrsa-replication-2=La materia comienza a obedecer. Desbloquea el replicador de elementos, el transductor de materia oscura y el conducto de nanofase — dando a la replicación forma, intención y la precisión para construir el mundo átomo a átomo.
dmrsa-replication-3=La química se vuelve reproducible. Desbloquea el replicador químico para químicos, aleaciones y fluidos. En Space Age este nivel está disponible ANTES de los planetas: la investigación de nivel 3 solo usa paquetes de ciencia química, y las tecnologías de replicación planetarias se construyen sobre él.
dmrsa-replication-4=Los dispositivos comienzan a replicarse a sí mismos. Desbloquea el replicador de dispositivos para máquinas complejas (circuitos avanzados, unidades de procesamiento, componentes de Space Age). Requiere visitar Vulcanus, Fulgora y Gleba en Space Age.
dmrsa-replication-5=Nada queda fuera de alcance. Desbloquea el replicador avanzado, el nivel más alto — los artefactos alienígenas, la materia exótica y los propios paquetes de ciencia se vuelven reproducibles. Requiere ciencia criogénica en Space Age.
dmrsa-replication-vulcanus=La forja habla. Desbloquea el replicador geotérmico en Vulcanus para sintetizar minerales metálicos y aleaciones avanzadas con eficiencia geotérmica.
dmrsa-replication-fulgora=La tormenta enseña. Desbloquea el replicador electromagnético en Fulgora para sintetizar componentes de holmio y circuitos avanzados usando velocidades de red cargadas por rayos.
dmrsa-replication-gleba=La vida, replicada. Desbloquea el biorreplicador en Gleba para sintetizar sustratos agrícolas frescos y materiales orgánicos con 100% de frescura.
dmrsa-replication-aquilo=El borde helado de la replicación. Desbloquea el replicador criogénico en Aquilo para sintetizar componentes de litio y materiales criogénicos a velocidades superconductoras extremas.
dmrsa-tenemut-synthesis=El vacío no está vacío — responde a la energía. Desbloquea el sintetizador de materia oscura, que extrae tenemut directamente del vacío sin usar nada más que electricidad (1 MW, 4 segundos por tenemut). Esta es la única fuente de tenemut cuando el ajuste 'Origen del tenemut' está en 'Solo síntesis'.
dmrsa-repl-tech=Investiga los patrones necesarios para replicar __1__.
dmrsa-mirror-tech=Replica cada objeto desbloqueado por __1__ — tras investigarla y los materiales base de su nivel.

dmrsa-replication-refining=Desbloquea el refinador de calidad, una máquina dedicada que mejora objetos replicables un grado de calidad a la vez. Cada ciclo de refinado cuesta 3x la energía de replicación, tiene una probabilidad que nunca salta un grado (1% → 0.5% → 0.25% → 0.1% para legendario) y un 5% de destruir la pieza. El replicador sigue siendo fiel: replica la materia tal como la conoce, en calidad normal.
dmrsa-replication-materials-1=Replica los materiales base del nivel 1: minerales, fluidos, placas y básicos vanilla.
