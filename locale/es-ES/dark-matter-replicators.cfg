[mod-setting-description]
tenemut-near-spawn=Si el mineral de tenemut se genera cerca del punto de aparición
tenemut-spawning-planet=En qué planeta aparecerá el tenemut
tenemut-other-planets=Generar tenemut en otros planetas también, con o sin Nauvis
dmrsa-tenemut-source=Elige de dónde proviene el tenemut. 'Yacimientos' (por defecto): el mineral de tenemut se genera en el mundo y no hay ningún sintetizador disponible. 'Yacimientos + síntesis': el mineral sigue generándose y el sintetizador de materia oscura (solo electricidad) también está disponible. 'Solo síntesis': no se coloca mineral de tenemut en ningún planeta — el tenemut se produce a partir de electricidad en el sintetizador de materia oscura.
dmrsa-tenemut-research-required=Si está activado (por defecto), las tecnologías de replicación requieren el paquete de material DMR de su nivel (tenemut, recolector de materia oscura, transductor, conducto de nanofase) como paquete de investigación. Desactívalo para investigar la replicación solo con paquetes de ciencia vanilla.
replstats-speed-base=La velocidad de fabricación de un replicador de nivel 1. Los niveles superiores multiplican esto por el factor de velocidad.
replstats-speed-factor=Se multiplica con cada aumento de nivel, resultando en crecimiento geométrico. Ten en cuenta que cambiar el tiempo por objeto sin cambiar la energía por tiempo cambiará la energía por objeto.
replstats-pollution-base=La contaminación por segundo de un replicador de nivel 1. Los niveles superiores multiplican esto por el factor de contaminación.
replstats-pollution-factor=Se multiplica con cada aumento de nivel, resultando en crecimiento geométrico.
replstats-size-base=Este valor se redondea hacia abajo a un entero después de realizar la suma. Si el tamaño resultante fuera negativo, se usará un tamaño de 1 en su lugar.
replstats-size-addend=Se suma con cada aumento de nivel, resultando en crecimiento lineal (o reducción, si crees que la tecnología debería hacerse más pequeña al avanzar).
replstats-modules-base=Este valor se redondea hacia abajo a un entero después de realizar la suma. Así es como los números predeterminados de ranuras de módulo son 1, 1, 2, 2 y 3. Si el número resultante de ranuras fuera negativo, el replicador no tendrá ranuras de módulo.
replstats-modules-addend=Se suma con cada aumento de nivel, resultando en crecimiento lineal.

replresearch-item-multiplier=El multiplicador base del número de repeticiones de investigación para replicar un objeto nuevo. Se multiplica por el nivel de replicación; el ajuste de dificultad de investigación lo escala aún más.
replresearch-item-time=La cantidad de tiempo que tarda un laboratorio de replicación en realizar una repetición de investigación.
replresearch-space-lock=El primer nivel de replicador cuya investigación requiere paquetes de ciencia espacial. Establécelo en 6 para mantener TODOS los replicadores en los planetas (no existe nivel 6, así que esto desactiva el bloqueo espacial).

replication-penalty=Esta cantidad fija se SUMA al coste final de cada receta de replicación (coste + penalización). Evita que replicar grandes cantidades de objetos baratos como minerales o placas sea demasiado poderoso.
replication-fluid-quantity=Esta es la cantidad de fluido creado cada vez que se replica un fluido. El tiempo por unidad de fluido sigue siendo el mismo.

replication-in-space=Permitir replicadores en el espacio (Space Age o Space Exploration)
dmrsa-tech-distribution=Elige cómo se desbloquean las recetas de replicación: 'Espejo' (por defecto) crea una tecnología de replicación por cada tecnología ORIGINAL del juego — desbloqueas "Replicación: <tecnología>" al investigar esa tecnología (y los materiales base de su nivel). 'Individual' (legacy) crea un nodo por objeto, como en v3.x.
dmrsa-require-original-tech=Al activarlo, replicar un objeto requiere antes investigar su tecnología de desbloqueo original (no puedes replicar lo que no sabes fabricar). Desactívalo para permitir la replicación solo con la máquina del nivel.
dmrsa-grouped-tech-cost-multiplier=El multiplicador aplicado al coste de investigación de las tecnologías de categorías agrupadas. Se eleva automáticamente a 15.0 cuando se detectan mods de overhaul (Bob's, Angel's, Krastorio 2) — cámbialo aquí si quieres otro valor.
dmrsa-use-machine-efficiency=Cuando está activado, los costes de replicación se ajustan según el tipo de máquina de la receta original. Fundir en un horno eléctrico cuesta menos de replicar que procesar petróleo en una refinería. Activado por defecto para un balance orientado a producción.
dmrsa-log-level=Controla la verbosidad de los mensajes de registro de [DarkMatterReplicators]. 'warn' (por defecto) muestra solo advertencias y errores; 'info' añade mensajes informativos como resúmenes de pasadas; 'debug' muestra trazas del solucionador de costes por objeto; 'none' silencia toda la salida del mod.
dmrsa-research-difficulty=Escala el coste (cantidad), el tiempo de investigación, el tiempo máximo de fabricación de las recetas de replicación Y los tiempos de replicación de TODAS las tecnologías de replicación. Fácil (rápida) es el valor por defecto: 25 de coste / 5s de tiempo / límite 600s / replicación x1.0 (tus ajustes replresearch-*). Media: 50/15s/1000s/replicación x1.5. Alta: 100/30s/1800s/replicación x2. Muy difícil: 200/45s/3200s/replicación x3.
dmrsa-research-pack-order=Orden de los ingredientes de investigación en el árbol de tecnologías de replicación. 'Objeto DMR primero' (por defecto) muestra el intermediario DMR personalizado (tenemut/scoop/transductor/conducto) antes que los paquetes de ciencia vanilla/SA. 'Paquete de ciencia primero' muestra los paquetes primero. Cosmético — el coste de investigación no cambia.

dmrsa-replicator-quality=Solo normal (por defecto): los replicadores producen siempre objetos de calidad normal — usa el refinador de calidad para mejorarlos. Permitir calidad: los módulos de calidad también funcionan directamente en los replicadores (permisivo, más barato que refinar).
