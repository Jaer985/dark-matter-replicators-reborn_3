[technology-name]
dmrsa-duplication-tech=Fuel Duplication (Tier __1__)

[technology-description]
dmrsa-duplication-tech=Teaches the replication network to duplicate chemical fuels. Every fuel replication recipe gains productivity — +100% output at tier 3, +200% at tier 4, +300% at tier 5, cumulative — and the Accelerator Ring's collision recipe is included. Read the numbers before you rebuild the grid around it: a plain boiler or furnace returns 0.80x the fuel's burn value even at tier 3, while a high-efficiency burner — a heating tower, 2.5x effectivity — turns that same tier into a real surplus (2.00x by tier 5). Duplication creates no energy on a plain boiler. The endgame power loop is the ring and the chamber: the Accelerator Ring manufactures the fuel, the Annihilation Chamber returns its full 25 GJ as heat on any planet, and duplication is what makes that loop profitable.
