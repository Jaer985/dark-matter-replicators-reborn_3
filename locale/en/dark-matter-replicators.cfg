[technology-description]
dmrsa-replication-1=The first whisper from the void. Unlocks the Simple Replicator, the Replication Lab and the Dark Matter Scoop — the first machine that copies matter, the lab that decodes it, and the instrument that reads it.
dmrsa-replication-2=Matter begins to obey. Unlocks the Element Replicator, the Dark Matter Transducer, and the Nanophase Conduit — giving replication shape, intent, and the precision to build the world atom by atom.
dmrsa-replication-3=Chemistry becomes reproducible. Unlocks the Chemical Replicator for chemicals, alloys, and fluids. In Space Age this tier is available BEFORE the planets: tier 3 research uses chemical science packs only, and the planetary replication technologies build on top of it.
dmrsa-replication-4=Devices begin to replicate themselves. Unlocks the Device Replicator for complex machines (advanced circuits, processing units, Space Age components). Requires visiting Vulcanus, Fulgora, and Gleba in Space Age.
dmrsa-replication-5=Nothing is beyond reach. Unlocks the Advanced Replicator, the highest tier — alien artifacts, exotic matter, and science packs themselves become reproducible. Requires cryogenic science in Space Age.
dmrsa-replication-vulcanus=The forge speaks. Unlock the Geothermal Replicator on Vulcanus to synthesize metallic ores and advanced alloys with geothermal efficiency.
dmrsa-replication-fulgora=The storm teaches. Unlock the Electromagnetic Replicator on Fulgora to synthesize holmium components and advanced circuits using lightning-charged grid speeds.
dmrsa-replication-gleba=Life, replicated. Unlock the Bio-Replicator on Gleba to synthesize fresh agricultural substrates and organic materials with 100% freshness.
dmrsa-replication-aquilo=The frozen edge of replication. Unlock the Cryogenic Replicator on Aquilo to synthesize lithium components and cryogenic materials at extreme superconductive speeds.
dmrsa-tenemut-synthesis=The vacuum is not empty — it answers to power. Unlocks the Dark Matter Synthesizer, which pulls tenemut straight out of the void using nothing but electricity (1 MW, 4 seconds per tenemut). This is the only tenemut source when the 'Tenemut source' setting is set to 'Synthesis only'.
dmrsa-repl-tech=Research the patterns required to replicate __1__.
dmrsa-mirror-tech=Replicate every item unlocked by __1__ — after researching it and the raw materials of its tier.

dmrsa-replication-refining=Unlocks the Quality Refiner, a dedicated machine that upgrades replicable items one quality grade at a time. Each refining cycle costs 3x replication energy, has a chance that never skips a grade (1% → 0.5% → 0.25% → 0.1% for legendary) and a 5% chance of destroying the piece. The replicator itself stays faithful — it replicates matter as it knows it, in normal quality.
dmrsa-replication-materials-1=Replicate the base materials of Tier 1: ores, fluids, plates and vanilla basics.
dmrsa-replication-materials-2=Replicate the base materials of Tier 2: ores, fluids, plates and vanilla basics.
dmrsa-replication-materials-3=Replicate the base materials of Tier 3: ores, fluids, plates and vanilla basics.
dmrsa-replication-materials-4=Replicate the base materials of Tier 4: ores, fluids, plates and vanilla basics.
dmrsa-replication-materials-5=Replicate the base materials of Tier 5: ores, fluids, plates and vanilla basics.
dmrsa-replication-materials=Replicate the base materials of this tier: ores, fluids, plates and vanilla basics.
