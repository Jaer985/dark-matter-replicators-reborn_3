[item-description]
dmrsa-tenemut=A crystalline mineral that resonates with dark matter when charged. Discovered on a remote world, it is the only known substance that can touch the void between atoms — and the only one that can be pushed through it. Mined from tenemut clusters, refined into the replication network's research packs, and consumed 25 at a time by the Accelerator Ring.
dmrsa-dark-matter-scoop=An instrument, not a machine: a charged tenemut cluster in a steel frame that reads the resonance of the void and reports what it finds. It can measure dark matter, and skim enough of it to copy loose ores and fluids — but it has nothing to measure at scale, and nothing to shape.
dmrsa-dark-matter-transducer=Where the scoop listens, the transducer speaks. An emitter array that takes the formless discharge the scoop collects and imposes a choice on it — this element, this shape, this plate — turning noise into a decision.
dmrsa-matter-conduit=A phased waveguide, nanometre-wide, that lets dark matter pass without decaying before it arrives. Without it the network can move matter; with it, the network can build circuits and processors — the parts too small for hands, and too precise for tools.
dmrsa-dark-matter=Matter that should not hold together, and does. The Accelerator Ring forces it out of tenemut and it stays put — 25 GJ in a single unit, the densest fuel the replication network can make, stable enough to sit in a chest, and willing to give all of it back as heat the moment a chamber lets it. No vanilla reactor will take it: the Annihilation Chamber is the only burner that accepts it.
dmrsa-replicator-vulcanus=Locked to Vulcanus. Tuned to the planet's geothermal heart — replicates metallurgical ores, calcite, and molten metals at 3x speed with high energy savings.
dmrsa-replicator-fulgora=Locked to Fulgora. Born from the planet's electromagnetic storms — replicates advanced electronics and superconducting components at 3x speed.
dmrsa-replicator-gleba=Locked to Gleba. The only machine capable of biological replication — outputs organic products at 100% freshness and 3x speed.
dmrsa-replicator-aquilo=Locked to Aquilo. Master of absolute cold — replicates cryo-refined elements and lithium components at an extreme 5x speed utilizing superconductive cooling.

# Item descriptions for replicator machines (mirrored from entity-description
# so the in-hand / cursor description resolves correctly).
dmrsa-replicator-1=Tier 1 replicator. The first machine to give shape to nothingness — converts tenemut-charged dark matter into loose materials (ores, fluids, basic plates). Crude output, but it is where replication begins.
dmrsa-replicator-2=Tier 2 replicator. Adds atomic shaping to the replication process — can form solid shapes and replicate pure elements with structural fidelity. Higher energy cost per craft than tier 1.
dmrsa-replicator-3=Tier 3 replicator. Extends replication to the molecular realm — chemical substances, alloys, and fluids. Unlocked before the planets with chemical science packs; planetary replicators handle planet-specific recipes.
dmrsa-replicator-4=Tier 4 replicator. Achieves machine-grade precision — replicates complex devices (advanced circuits, processing units, most Space Age components) with nanometer-scale fidelity.
dmrsa-replicator-5=Tier 5 replicator. The peak of replication — copies anything the mod considers replicable, including alien artifacts, exotic matter, and science packs themselves.

dmrsa-refiner=Re-emits replicated matter through a violet obsidian lattice, forcing the material pattern one quality grade higher. Accepts only structures whose replication you already master — the same items the replicator network can copy. Each cycle costs three times the energy of a normal replication and risks destroying the piece (5% loss): a faithful, punishing path to quality that never skips a grade.
dmrsa-tenemut-synthesizer=Grows tenemut from the vacuum. The crystal lattice does not exist in the discharge — the machine insists on it, atom by atom, one every 4 seconds for 1 MW of continuous power. Slow, cramped and power-hungry compared to a mine, but it is the one source of tenemut that does not need a planet to have one.
[entity-description]
dmrsa-tenemut=A cluster of tenemut crystals embedded in stone. Each cluster can be mined to extract tenemut, the base fuel for all replication recipes.

