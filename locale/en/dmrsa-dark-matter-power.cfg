[technology-description]
dmrsa-collider-1=The ring that tears matter apart. Unlocks the Accelerator Ring and the collision recipe that turns 25 tenemut and one Nanophase Conduit into a single unit of dark matter - 250 MW for 200 seconds. Dark matter is the densest fuel the replication network can make at 25 GJ per unit, and no vanilla reactor will burn it: only the Annihilation Chamber accepts it. Making it costs more energy than it returns until the duplication research catches up.
dmrsa-annihilation=The chamber that gives dark matter back. Unlocks the Annihilation Chamber, a dark-matter reactor that burns one unit over ten minutes of heat and hands that heat to the vanilla exchangers and turbines. Researching this technology consumes dark matter: every repetition spends a unit you could have burned for power instead.
dmrsa-annihilation-coil=The lattice that skips the boiler. Unlocks the Annihilation Coil, a 2x2 burner-generator that burns one unit of dark matter over ten minutes and puts 41.7 MW straight on the grid. Same 25 GJ per unit as the chamber, and the same fuel: the difference is everything the chamber needs behind it - heat pipes, water, heat exchangers and steam turbines. Instant response, a quarter of the footprint, and no plumbing to defend; the joules are identical.
