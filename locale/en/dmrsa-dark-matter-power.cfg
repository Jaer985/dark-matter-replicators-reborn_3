[item-name]
dmrsa-collider=Accelerator Ring
dmrsa-annihilator=Annihilation Chamber
dmrsa-annihilation-coil=Annihilation Coil

[item-description]
dmrsa-collider=A ring of superconducting magnets that hurls tenemut clusters into one another until the debris collapses into raw dark matter. It draws 250 MW for 200 seconds to produce one unit: 50 GJ of work for 25 GJ of fuel, until the duplication research closes the gap. The network has spent five tiers borrowing matter and putting it back together; the ring stops borrowing. For the first time the factory does not copy a substance — it manufactures one that does not occur in nature.
dmrsa-annihilator=Burns dark matter and returns it as pure heat. The chamber annihilates the substance with itself — metastable matter given permission to decay — which is why one unit gives back its full 25 GJ: ten minutes of heat at 41.7 MW, turned into electricity by the vanilla heat exchangers and steam turbines. Half of the loop: the ring spends 50 GJ to make a unit worth 25, and the duplication research is where the ledger turns a profit.
dmrsa-annihilation-coil=Catches the decay instead of the heat. The chamber lets dark matter fall apart and collects what falls out as warmth; the coil threads a phased lattice through that same decay and takes the charge directly, so nothing between the fuel and the grid is made of pipes. 2x2, no water, no heat exchangers, no steam turbines: 25 GJ per unit, ten minutes at 41.7 MW, exactly the chamber's ledger. It wins on footprint and plumbing, not on joules - and it answers the grid the same tick it is fuelled.

